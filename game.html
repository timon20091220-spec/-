<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#050814;color:#eef2ff;font-family:system-ui,sans-serif;touch-action:none}
canvas{display:block;width:100vw;height:100vh;background:#050814}
.hud{position:fixed;inset:0;pointer-events:none}
.hidden{display:none!important}
.top{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.panel{background:rgba(10,16,34,.72);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:8px 12px}
.bar{width:170px;height:12px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:6px}
.fill{height:100%;background:linear-gradient(90deg,#67e8f9,#8b5cf6)}
.menu,.cards,.gameover,.weaponpick,.story{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1120px,94vw);text-align:center}
.cards,.weaponpick{display:none;gap:12px;pointer-events:auto}
.story{display:none;pointer-events:auto;position:fixed;inset:0;left:0;top:0;transform:none;width:100vw;height:100vh;background:#000;z-index:5}

.patchnotes h2{margin:0 0 10px;color:#67e8f9}.patchnotes li{margin:7px 0;line-height:1.45}.story .box{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(920px,92vw)}

.tag{display:inline-block;margin-bottom:10px;padding:5px 10px;border-radius:999px;font-size:12px;font-weight:900;background:rgba(255,255,255,.1)}
button{pointer-events:auto;border:0;border-radius:12px;padding:12px 16px;color:#fff;background:linear-gradient(135deg,#2563eb,#7c3aed);font-weight:800}

.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);font-weight:800;opacity:0}
.gameover{display:none;pointer-events:auto}
.gameover .box,.weaponpick .box{background:rgba(10,16,34,.94);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px}

.bossRewardGrid{display:grid!important;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;align-items:stretch;pointer-events:auto}

.bossRewardGrid .tag,.bossRewardGrid p,.miniRewardGrid .tag,.miniRewardGrid p{display:none!important}
.bossRewardGrid .card h3,.miniRewardGrid .card h3{margin:0;font-size:clamp(14px,1.8vw,20px);line-height:1.25}
.bossRewardGrid .card:nth-last-child(2){grid-column:2/3}
.bossRewardGrid .card:nth-last-child(1){grid-column:3/4}
.miniRewardGrid .card:nth-last-child(2){grid-column:1/2}
.miniRewardGrid .card:nth-last-child(1){grid-column:2/3}
.rewardTitle{grid-column:1/-1;text-align:center;font-weight:900;font-size:22px;margin-bottom:4px;color:#67e8f9;text-shadow:0 0 14px rgba(103,232,249,.45)}

/* Mobile app controls */

<body>
<canvas id="game"></canvas>
<div id="errorBox"></div>
<div id="installTip" class="installTip"></div>
<div id="mobileControls" class="mobileControls" aria-hidden="true">
  
  <div id="joystick" class="joystick"><div id="stick" class="stick"></div></div>
  <div class="actionBtns">
    <button id="dashTouch" class="touchBtn" type="button">DASH</button>
    <button id="novaTouch" class="touchBtn nova" type="button">NOVA</button>
  </div>
</div>
<div class="hud">
  <div id="gameUI" class="hidden">
    <div class="top">
      <div class="panel"><div id="danger">위험도 1</div><div id="spawn" style="font-size:12px;opacity:.8;margin-top:4px">몬스터 출현 중</div></div>
      <div class="panel"><div id="hpText">HP 100 / 100</div><div class="bar"><div id="hpFill" class="fill" style="width:100%"></div></div></div>
      <div class="panel"><div id="xpText">LV 1</div><div class="bar"><div id="xpFill" class="fill" style="width:0%"></div></div></div>
      <div class="panel"><div id="weaponText">무기 라이플</div><div id="weaponSub" style="font-size:12px;opacity:.8;margin-top:4px">1단계</div></div>
      <div class="panel"><div>COMBO x<span id="combo">0</span></div><div id="kills" style="font-size:12px;opacity:.8;margin-top:4px">KILL 0</div></div><div class="panel"><div id="arenaTimer">보스 제한시간 없음</div></div>
    </div>
    <div class="boss panel" id="bossWrap">
      <div id="bossTitle" style="text-align:center;font-weight:900;margin-bottom:6px">BOSS</div>
      <div class="bar" style="width:100%;height:16px"><div id="bossFill" class="fill" style="width:100%;background:linear-gradient(90deg,#fb7185,#dc2626)"></div></div>
    </div>
    <div id="minimapWrap"><canvas id="minimap" width="136" height="136"></canvas></div>
  </div>

  <div class="menu" id="menu">
    <h1 style="font-size:clamp(34px,7vw,74px);margin:0 0 8px">NEON RIFT<br>ARSENAL</h1>
    <div style="opacity:.85;margin-bottom:16px">10웨이브 보스전 · 상자 아이템 · 30웨이브 이후 하드모드 · 레이저 리밸런스</div>
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
      <button id="startBtn">일반 모드</button>
      <button id="hardBtn">🔒 하드모드</button>
      <button id="rangedTestBtn">원거리 테스트</button>
      <button id="chargerTestBtn">돌진 테스트</button>
      <button id="tankTestBtn">탱커 테스트</button>
      <button id="howBtn">조작법</button>
    </div>
    <div id="how" class="hidden" style="margin-top:14px;opacity:.9;line-height:1.6">
      PC: WASD/방향키 이동 · Shift 대시 · Space NOVA
    </div>
  </div>

  <div class="story" id="story">
    <div class="box" style="background:rgba(0,0,0,.74);border:1px solid rgba(103,232,249,.34);border-radius:22px;padding:30px;box-shadow:0 0 48px rgba(56,189,248,.24)">
      <div id="storyScene" class="tag">장면 1</div>
      <h2 id="storyTitle" style="font-size:clamp(26px,5vw,52px);margin:10px 0 14px;color:#67e8f9">멸망한 지구</h2>
      <p id="storyText" style="font-size:clamp(18px,3vw,28px);line-height:1.65;margin:0 0 22px">지구가 멸망하고, 제 2의 지구를 찾기 위해 우리는 긴 여정을 떠났다..</p>
      <button id="storyNextBtn">다음</button>
    </div>
  </div>

  <div class="weaponpick" id="weaponpick">
    <div class="box">
      <h2 style="margin-top:0">시작 무기 선택</h2>
      <div id="weaponPickCards" style="display:flex;gap:12px;flex-wrap:wrap;justify-content:center"></div>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <div class="gameover" id="gameover">
    <div class="box">
      <h2 style="margin-top:0;font-size:38px">GAME OVER</h2>
      <div id="gameoverStats" style="opacity:.88;line-height:1.7;margin:18px 0 22px"></div>
      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button id="retryBtn">다시 시작</button><button id="lobbyBtn">로비로</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>

window.addEventListener('error', function(e){
  var box=document.getElementById('errorBox');
  if(box){box.style.display='block';box.textContent='게임 오류: '+(e.message||'알 수 없는 오류')+'\n새로고침하거나 PC/Android 앱 프로젝트 버전을 사용해봐.';}
});
window.addEventListener('unhandledrejection', function(e){
  var box=document.getElementById('errorBox');
  if(box){box.style.display='block';box.textContent='게임 오류: '+((e.reason&&e.reason.message)||e.reason||'알 수 없는 오류')+'\n새로고침하거나 PC/Android 앱 프로젝트 버전을 사용해봐.';}
});

  function upgradeWeaponState(w) {
    if (!w || w.stage >= 5) return;
    w.stage++;
    // 최고 레벨을 5로 낮춘 대신, 매 업그레이드 체감이 크게 나도록 강화 폭을 키움.
    if (w.key === 'shotgun') {
      // 샷건 성장 곡선 재조정: 1레벨은 느리고 묵직하지만, 레벨업할수록 확실히 빨라지고 안정화된다.
      w.dmg += 11;
      w.fr = Math.max(.26, w.fr * .72);
      w.spread = Math.max(.034, w.spread * .78);
      w.range += .14;
      w.bs += 100;
      w.bsize += .75;
      if (w.stage === 3 || w.stage === 5) w.bcount = Math.min(9, w.bcount + 1);
      if (w.stage >= 4) w.pierce = Math.max(w.pierce, 1);
    }
    else if (w.key === 'laser') {
      w.dmg += 24; w.fr = Math.max(.15, w.fr * .84); w.laserWidth += 4; w.laserLength += 90; w.chainCount = Math.min(7, Math.max(w.chainCount, Math.max(0, w.stage - 1)));
    }
    else if (w.key === 'cannon') {
      w.dmg += 26; w.fr = Math.max(.26, w.fr * .87); w.bsize += 2.4; w.range += .10; w.bs += 80; w.pierce = Math.max(w.pierce, 1);
    }
    else {
      // 서브무기: 1레벨은 약하지만 레벨업할수록 강해지도록 상승폭을 크게 둠.
      w.dmg += w.key === 'rail' ? 18 : w.key === 'rocket' ? 18 : w.key === 'thunder' ? 16 : 12;
      w.fr = Math.max(.18, w.fr * .88);
      if (['rifle','pulse','shard','flame','poison','orbit','drone','boomer','ice'].includes(w.key)) w.bcount = Math.min(8, w.bcount + 1);
      if (['laser','thunder','rail'].includes(w.key)) { w.laserWidth += 3; w.laserLength += 90; w.chainCount += 1; }
      if (['rocket','mine'].includes(w.key)) w.bsize += 1.8;
      w.bs += w.bs > 0 ? 60 : 0;
    }
    w.pierce = Math.min(5, w.pierce + (w.stage >= 3 ? 1 : 0));
    syncMainWeaponStats();
  }

  function blueprintDescFor(w) {
    const map = {
      laser:'고출력 집속 렌즈: 피해 +22, 감전 범위 증가, 사슬 +2. 초반 약한 전이가 강해짐. 최종진화 재료로도 사용됨',
      shotgun:'초크 튜브: 탄 퍼짐 감소, 탄속 증가, 근거리 위험 완화. 최종진화 재료로도 사용됨',
      cannon:'파편 포탄: 포탄 폭발 범위와 폭발 피해 증가. 최종진화 재료로도 사용됨',
      thunder:'축전 코어: 낙뢰 범위와 연쇄 수 증가. 최종진화 재료로도 사용됨',
      drone:'AI 조준칩: 드론 발사 수와 명중률 증가. 최종진화 재료로도 사용됨',
      ice:'냉각 증폭기: 둔화 시간과 장판 범위 증가. 최종진화 재료로도 사용됨',
      poison:'독성 촉매: 지속 피해와 독구름 범위 증가. 최종진화 재료로도 사용됨'
    };
    return map[w.key] || '전용 부품: 해당 무기의 핵심 성능을 올리고, 최종진화 재료로 사용됨';
  }

  function applyBlueprintBonus(w) {
    w.blueprint = true;
    if (w.key === 'laser') { w.dmg += 22; w.chainCount = Math.min(7, Math.max(w.chainCount, w.stage >= 2 ? w.stage : 0) + (w.stage >= 3 ? 1 : 0)); w.laserWidth += 2; w.laserLength += 120; }
    else if (w.key === 'shotgun') { w.dmg += 9; w.spread = Math.max(.030, w.spread * .78); w.bs += 90; w.range += .12; w.bsize += .6; }
    else if (w.key === 'cannon') { w.dmg += 10; w.bsize += 2.4; w.range += .08; }
    else if (w.key === 'thunder') { w.laserWidth += 5; w.chainCount += 3; }
    else if (w.key === 'drone') { w.bcount = Math.min(8, w.bcount + 2); w.dmg += 5; }
    else if (w.key === 'ice') { w.dmg += 5; w.range += .12; }
    else if (w.key === 'poison') { w.dmg += 6; w.range += .12; }
    else { w.dmg += 8; w.fr = Math.max(.08, w.fr * .93); }
    syncMainWeaponStats();
  }


  function evolveWeaponState(w) {
    if (!w) return;
    w.blueprint = false; w.evolved = true; w.evoPulse = 1;
    const key = w.key;
    // 최종진화는 단순 딜뻥보다 패턴/연출 강화 위주. 레이저는 너무 세던 최종 밸류를 의도적으로 낮춤.
    const dmgBonus = { laser:18, shotgun:22, cannon:22, thunder:16, poison:14, ice:14, drone:12, orbit:13, rocket:18, rail:18, flame:13, mine:16, boomer:13, pulse:13, shard:13, rifle:13 };
    w.dmg += dmgBonus[key] ?? 14;
    w.fr = Math.max(.12, w.fr * (key === 'laser' ? .92 : key === 'shotgun' ? .62 : .80));
    if (!['laser','thunder','rail'].includes(key)) w.bcount = Math.min(12, w.bcount + 1);
    w.pierce = Math.max(w.pierce, key === 'shotgun' ? 3 : 4);
    if (key === 'shotgun') { w.bcount = Math.min(13, w.bcount + 4); w.spread = Math.max(.022, w.spread * .68); w.range += .26; w.bsize += 1.2; w.bs += 170; w.fr = Math.max(.16, w.fr); }
    if (key === 'laser') { w.laserWidth += 4; w.laserLength += 40; w.chainCount = Math.min(8, Math.max(w.chainCount + 2, 6)); }
    else if (key === 'thunder') { w.laserWidth += 4; w.laserLength += 160; w.chainCount += 4; }
    if (['cannon','rocket','mine'].includes(key)) w.bsize += 3;
    for (let i=0;i<22;i++) { const a = Math.PI*2*i/22; if (novaEffects.length < 120) novaEffects.push({x:p.x+Math.cos(a)*60,y:p.y+Math.sin(a)*60,r:120,maxR:120,color:weaponPool[key]?.color||'#fff',life:.42,maxLife:.42,kind:key==='laser'?'pulse':'crack'}); }
    toastMsg(`${weaponPool[key]?.name || '무기'} 최종진화!`);
    syncMainWeaponStats();
  }


  function getWeaponUpgradeOptions() {
    const opts = [];
    for (const w of p.weapons) {
      const wp = weaponPool[w.key];
      if (w.stage >= 5 && w.blueprint && !w.evolved) {
        opts.push({ tag:'최종진화', name:`${wp.name} 최종 무기`, desc:'5단계 + 설계도 보유: 새 전투 패턴과 전용 연출을 얻는다.', priorityFinal:true, fn(){ evolveWeaponState(w); } });
        continue;
      }
      if (w.stage < 5) {
        const penalty = weaponUpgradePenaltyWindows > 0 && lastChosenWeaponUpgradeKey === w.key;
        opts.push({ tag:'무기강화', name:`${wp.name} ${w.stage + 1}단계`, desc:`장착 중인 ${wp.name} 강화${penalty ? ' · 직전 강화라 이번 창 등장률 감소' : ''}`, penalty, fn(){ upgradeWeaponState(w); lastChosenWeaponUpgradeKey = w.key; weaponUpgradePenaltyWindows = 1; } });
      }
      if (!w.blueprint && !w.evolved) {
        opts.push({ tag:'무기설계도', name:`${wp.name} 설계도`, desc:blueprintDescFor(w), blueprint:true, fn(){ applyBlueprintBonus(w); } });
      }
    }
    return opts;
  }


  function getNewWeaponOptions() {
    if (p.weapons.length >= MAX_WEAPONS) return [];
    return weaponKeys.filter(k => !p.weapons.some(w => w.key === k)).map(k => {
      const wp = weaponPool[k];
      return { tag:'새 패시브 무기', name:`${wp.name} 장착`, desc:`현재 ${p.weapons.length}/${MAX_WEAPONS}개 장착 · 서브로 장착하면 자동 패시브 스킬 발동 · ${wp.desc}`, fn(){ const nw = makeWeaponState(k); nw.passiveCd = 0.35; p.weapons.push(nw); syncMainWeaponStats(); } };
    });
  }

  function getStatPool() {
    const pool = [
      { tag:'능력치', name:'전체 연사 강화', desc:'모든 무기 발사 속도 증가', fn(){ for (const w of p.weapons) w.fr = Math.max(.12, w.fr * .94); syncMainWeaponStats(); } },
      { tag:'능력치', name:'전체 공격력 강화', desc:'모든 무기 피해량 증가', fn(){ for (const w of p.weapons) w.dmg += w.key === 'laser' ? 4 : 3; syncMainWeaponStats(); } },
      { tag:'능력치', name:'멀티 샷', desc:'모든 탄환형 무기 개수 +1', fn(){ for (const w of p.weapons) if (!['laser','thunder'].includes(w.key)) w.bcount = Math.min(12, w.bcount + 1); syncMainWeaponStats(); } },
      { tag:'능력치', name:'탄속 / 크기', desc:'투사체 무기 명중감 상승', fn(){ for (const w of p.weapons) { w.bs += w.bs > 0 ? 65 : 0; w.bsize += .35; } syncMainWeaponStats(); } },
      { tag:'능력치', name:'체력 업', desc:'최대 체력 +18, 회복', fn(){ p.maxHp += 14; p.hp = Math.min(p.maxHp, p.hp + 18); } },
      ...(p.lv >= NOVA_UNLOCK_LEVEL ? [{ tag:'능력치', name:'NOVA 충전', desc:'NOVA 쿨 감소', fn(){ p.novaCd = Math.max(0, p.novaCd - 5); } }] : []),
      { tag:'능력치', name:'치명타', desc:'치명타 확률 증가', fn(){ p.crit = Math.min(0.24, p.crit + 0.035); } },
      { tag:'능력치', name:'흡혈', desc:'피해량 일부 회복', fn(){ p.lifesteal = Math.min(0.055, p.lifesteal + 0.010); } },
      { tag:'능력치', name:'이동 속도', desc:'캐릭터 이동속도 증가', fn(){ p.moveSpeed += 12; } },
      { tag:'능력치', name:'자석 강화', desc:'획득 범위 증가', fn(){ p.pickupRadius += 14; } },
      { tag:'능력치', name:'재생', desc:'초당 체력 회복', fn(){ p.regen += 0.22; } },
      { tag:'능력치', name:'실드', desc:'받는 피해 감소', fn(){ p.shield = Math.min(0.18, p.shield + 0.035); } },
      { tag:'능력치', name:'보스 헌터', desc:'보스 대상 추가 피해', fn(){ p.bossBonus += 0.08; } }
    ];
    return pool.concat(getNewWeaponOptions());
  }


  function weightedPickUnique(items, count) {
    const out = [], pool = items.slice();
    let guard = 0;
    while (out.length < count && pool.length && guard++ < 300) {
      const total = pool.reduce((s, it) => s + Math.max(0.01, it.weight || 1), 0);
      let r = Math.random() * total, idx = 0;
      for (; idx < pool.length; idx++) { r -= Math.max(0.01, pool[idx].weight || 1); if (r <= 0) break; }
      const pick = pool.splice(Math.min(idx, pool.length - 1), 1)[0];
      if (pick && !out.some(v => v.name === pick.name)) out.push(pick);
    }
    return out;
  }

  function showReward(source) {
    setMobileControlsVisible(false);
    if (state === 'reward') { queuedReward = source === 'boss' ? 'boss' : (queuedReward || 'lv'); return; }
    state = 'reward'; ui.cards.innerHTML = '';
    ui.cards.classList.remove('bossRewardGrid'); ui.cards.classList.remove('miniRewardGrid');
    const weaponOpts = getWeaponUpgradeOptions();
    const finalOpts = weaponOpts.filter(o => o.priorityFinal);
    let opts = [];
    if (finalOpts.length) opts.push(rnd(finalOpts));

    const weighted = [];
    for (const o of weaponOpts) {
      if (opts.some(v => v.name === o.name)) continue;
      weighted.push(Object.assign({}, o, { weight: o.priorityFinal ? 99 : o.blueprint ? 2.10 : o.penalty ? 0.20 : 5.60 }));
    }
    for (const o of getStatPool()) weighted.push(Object.assign({}, o, { weight: o.tag === '새 패시브 무기' ? 0.90 : 0.46 }));
    opts = opts.concat(weightedPickUnique(weighted, 4 - opts.length));
    if (!opts.length) { state = 'play'; return; }
    p.rewardPicks = 1;
    opts.forEach(o => {
      const d = document.createElement('div');
      d.className = 'card';
      d.innerHTML = `<div class="tag">${o.tag}</div><h3>${o.name}</h3><p>${o.desc || ''}</p>`;
      bindTap(d, () => {
        if (d.dataset.used === '1') return;
        d.dataset.used = '1';
        try { o.fn(); } catch (err) { console.warn('reward option error', err); }
        toastMsg(o.name);
        ui.cards.style.display = 'none';
        const next = queuedReward; queuedReward = null;
        state = 'play';
        setMobileControlsVisible(true);
        if (next) setTimeout(() => next === 'bossChest' ? showBossChestReward() : next === 'miniChest' ? showMiniBossReward() : showReward(next), 60);
      });
      ui.cards.appendChild(d);
    });
    ui.cards.style.display = 'flex'; toastMsg('레벨업 보상');
    if (weaponUpgradePenaltyWindows > 0) weaponUpgradePenaltyWindows--;
  }


  function buildRewardCandidates(count=10) {
    const all = [];
    const weaponOpts = getWeaponUpgradeOptions();
    const finalOpts = weaponOpts.filter(o => o.priorityFinal);
    finalOpts.forEach(o => all.push(o));
    const weighted = [
      ...weaponOpts, ...weaponOpts, ...weaponOpts, ...weaponOpts, ...weaponOpts,
      ...getStatPool(), ...getStatPool()
    ];
    let guard = 0;
    while (all.length < count && weighted.length && guard++ < 260) {
      const a = rnd(weighted);
      if (a && !all.some(v => v.name === a.name)) all.push(a);
    }
    return all.slice(0, count);
  }

  function applyDamageToEnemy(e, dmg, knock=false) {

    if (knock && e.t !== 'chest') {

  function finalLaserShockPulse(primary, dmg, hitSet) {

  function chainLaserDamage(primary, dmg) {
    if (!primary || primary.dead || !enemies.includes(primary)) return;
    const hit = new Set([primary]);
    applyDamageToEnemy(primary, dmg);
    if (!enemies.length) return;
    // 초반 레이저 완화: 1레벨부터 아주 약한 1회 전이가 생기지만,
    // 레벨이 낮을수록 전이 범위/피해가 작아서 후반 성장 여지는 유지한다.
    const chainLimit = p.finalLaser ? Math.min(12, enemies.length) : Math.max(0, Math.min(p.chainCount, 16));
    if (p.finalLaser) {
      const nearby = enemies.slice().filter(e => e && !e.dead && !hit.has(e) && e.t !== 'chest' && isOnScreen(e, 80) && Math.hypot(e.x - primary.x, e.y - primary.y) < 285).slice(0, Math.min(7, chainLimit));

        applyDamageToEnemy(e, dmg * 0.52);
        finalLaserShockPulse(e, dmg, hit);
      }
      finalLaserShockPulse(primary, dmg, hit);
      return;
    }
    let current = primary;
    for (let c = 0; c < chainLimit; c++) {
      let best = null, bestD = Infinity;
      for (const e of enemies) {
        if (!e || e.dead || hit.has(e)) continue;
        const d = Math.hypot(e.x - current.x, e.y - current.y);
        const chainRange = (p.chainCount <= 1 ? 145 : 185 + Math.max(0, p.chainCount) * 24);
        if (d < chainRange && d < bestD) { bestD = d; best = e; }
      }
      if (!best) break;
      hit.add(best);
      if (laserBeams.length < 90) laserBeams.push({ x1: current.x, y1: current.y, x2: best.x, y2: best.y, width: Math.max(4, p.laserWidth * 0.55), life: 0.08, color: '#c084fc' });

  function fireLaser(target, w, visibleOnly=false) {

    // 보이는 대상이 없으면 최근 이동/바라보는 방향으로만 발사 이펙트를 낸다.
    const base = target && !target.dead ? Math.atan2(target.y - p.y, target.x - p.x) : getAimAngle(null);
    const count = w.bcount;
    const candidates = visibleOnly ? screenTargets(true, 40) : enemies;
    const visualLength = target ? w.laserLength : Math.min(w.laserLength, Math.max(innerW, innerH) * 0.62);
    for (let i = 0; i < count; i++) {
      const off = count === 1 ? 0 : (i - (count - 1) / 2) * 0.05;
      const ang = base + off;
      const endX = p.x + Math.cos(ang) * visualLength;
      const endY = p.y + Math.sin(ang) * visualLength;
      laserBeams.push({ x1:p.x, y1:p.y, x2:endX, y2:endY, width:w.laserWidth, life:0.10, color:weaponPool[w.key].color });
      let firstHit = null, firstT = 999;
      for (const e of candidates) {
        if (!e || e.dead) continue;
        const vx = endX - p.x, vy = endY - p.y, wx = e.x - p.x, wy = e.y - p.y;
        const c1 = vx * wx + vy * wy, c2 = vx * vx + vy * vy;

        if (dist < e.r + w.laserWidth * 0.7 && t < firstT) { firstT = t; firstHit = e; }
      }
      if (firstHit) {
        const old = { weapon:p.weapon, finalLaser:p.finalLaser, chainCount:p.chainCount, laserWidth:p.laserWidth };
        p.weapon = w.key; p.finalLaser = w.evolved; p.chainCount = w.chainCount; p.laserWidth = w.laserWidth;
        chainLaserDamage(firstHit, w.dmg * (w.evolved ? 1.02 : 1.34));

      }
    }
  }


  function getAimAngle(target=null) {

  }

  function shootWeapon(w) {

    for (const e of enemies) {
      if (!e || e.dead) continue;
      const d = (e.x - p.x) ** 2 + (e.y - p.y) ** 2;
      if (d < bd) { bd = d; target = e; }
    }
    const isMain = p.weapons[0] === w;
    if (w.key === 'laser') {
      const visibleTarget = nearestScreenTargetFrom(p.x, p.y, true, 1500);
      fireLaser(visibleTarget, w, true);
      return;
    }
    if (!target) return;
    if (w.key === 'thunder') { fireLaser(target, w); return; }
    const base = Math.atan2(target.y - p.y, target.x - p.x), count = w.bcount;
    const color = weaponPool[w.key].color;
    const add = (a, mul=1, size=0, pierce=w.pierce, spd=w.bs) => { if (bullets.length < 420) bullets.push({ x:p.x+Math.cos(a)*18, y:p.y+Math.sin(a)*18, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r:w.bsize+size, d:w.dmg*mul, life:1.12*w.range, pierce, hit:new Set(), c:color, src:w.key }); };
    if (w.key === 'shotgun' || w.key === 'flame') {
      const shotgunMain = w.key === 'shotgun' && p.weapons[0] === w;

  function xpTierForEnemy(e) {
    if (!e) return 1;
    if (['normal','split','shoot','charger'].includes(e.t)) return 1;
    if (['tank','sniper','bomber','healer'].includes(e.t)) return 2;
    return 3;
  }
  function xpAmountForEnemy(e) {
    const tier = xpTierForEnemy(e);
    // 초반에는 XP를 낮게 유지하고, 후반으로 갈수록 드랍량이 더 크게 늘어나게 조정.
    const earlyScale = currentWave <= 5 ? 0.72 : currentWave <= 10 ? 0.86 : 1.0;
    const waveBonus = Math.floor(currentWave * 1.4);
    const midBonus = Math.max(0, currentWave - 10);
    const lateBonus = Math.max(0, currentWave - 20);
    const hardBonus = hardMode ? Math.floor(currentWave * 1.35) : 0;
    const base = tier === 1 ? 8 : tier === 2 ? 19 : 42;
    const growth = tier === 1
      ? waveBonus * 2 + Math.floor(midBonus * 1.7) + Math.floor(lateBonus * 2.8) + hardBonus
      : tier === 2
        ? waveBonus * 4 + Math.floor(midBonus * 2.9) + Math.floor(lateBonus * 4.2) + hardBonus * 2
        : waveBonus * 7 + Math.floor(midBonus * 4.4) + Math.floor(lateBonus * 6.5) + hardBonus * 3;
    return Math.max(3, Math.floor((base + growth) * earlyScale));
  }
  function dropXpOrb(x0, y0, amount, tier=1, ox=0, oy=0) {
    if (pickups.length >= 190) return;
    pickups.push({ x:x0 + ox, y:y0 + oy, t:'xp', amount, tier, life:999999, permanent:true });
  }
  function dropChestReward(x0, y0, type, amount=0) {
    if (type === 'xp') dropXpOrb(x0, y0, amount || 22, 2, (Math.random()-.5)*20, (Math.random()-.5)*20);
    else pickups.push({ x:x0, y:y0, t:type, life:999999, permanent:true });
  }

  function openChest(e) {

    const r = Math.random();

    }
    else { dropXpOrb(e.x, e.y, 70 + currentWave * 4, 2); dropXpOrb(e.x+16, e.y, 70 + currentWave * 4, 2); toastMsg('상자 파괴: 경험치'); }
  }


  function die(e) {

  }

  function bossArenaBounds(margin=34) {
    const aw = world.w * arenaShrinking, ah = world.h * arenaShrinking;
    const ax = (world.w - aw) / 2, ay = (world.h - ah) / 2;
    return { x1: ax + margin, y1: ay + margin, x2: ax + aw - margin, y2: ay + ah - margin };
  }
  function clampToBossArena(obj, margin=34) {
    if (!dir.bossRound || arenaShrinking >= 0.99 || !obj) return;
    const b = bossArenaBounds(margin);
    obj.x = Math.max(b.x1, Math.min(b.x2, obj.x));
    obj.y = Math.max(b.y1, Math.min(b.y2, obj.y));
  }

  function bossPattern(e, dt) {
    e.pcd -= dt;
    if (e.pcd > 0) return;
    const a = Math.atan2(p.y - e.y, p.x - e.x);
    if (e.t === 'miniBoss') {
      e.pcd = hardMode ? .95 : 1.10;
      // 중간보스는 직접 패턴보다 몬스터 군단을 끌고 오는 지휘관 역할
      for (let k=0;k<(hardMode?7:5);k++) spawn(k%2 ? 'split' : 'charger');
      for (let i = 0; i < 8; i++) {
        const ang = a + i * (Math.PI * 2 / 8);
        enemyBullets.push({ x: e.x, y: e.y, vx: Math.cos(ang) * 225, vy: Math.sin(ang) * 225, r: 6, d: 13, life: 3.0 });
      }
      e.phase++;
    } else if (e.t === 'arenaBoss') {
      const type = e.bossType || 0;
      const rage = e.hp < e.mhp * .5;
      if (rage && !e.rageAnnounced) { e.rageAnnounced = true; effectText(e.x, e.y - 60, '폭주'); toastMsg('보스 폭주!'); shake = Math.max(shake, .22); }
      e.pcd = ([1.05, .82, 1.10][type] * (rage ? .62 : 1)) * (hardMode ? .75 : 1);
      const dmgMul = rage ? 1.45 : 1;
      if (type === 0) {
        const mode = e.phase % (rage ? 5 : 4);
        if (mode === 0) for (let i = 0; i < (rage?18:14); i++) { const ang = i * (Math.PI * 2 / (rage?18:14)) + (rage?e.phase*.08:0); enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(ang)*(rage?245:205), vy:Math.sin(ang)*(rage?245:205), r:7, d:13*dmgMul, life:3.1 }); }
        else if (mode === 1) for (let i = -3; i <= 3; i++) enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+i*.12)*(rage?330:285), vy:Math.sin(a+i*.12)*(rage?330:285), r:8, d:16*dmgMul, life:2.2 });
        else if (mode === 2) { effectText(e.x, e.y - 46, rage?'폭주 돌진':'DASH'); e.x += Math.cos(a) * (rage?190:120); e.y += Math.sin(a) * (rage?190:120); clampToBossArena(e); shake = Math.max(shake, .14); }
        else if (mode === 3) for (let i=0;i<12;i++){ const ang=a + (i-6)*.22; enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(ang)*(rage?270:225),vy:Math.sin(ang)*(rage?270:225),r:6,d:12*dmgMul,life:2.4}); }
        else for (let i=0;i<16;i++){ const zig=a + (i-8)*.18 + (i%2? .25:-.25); enemyBullets.push({x:e.x,y:e.y,vx:Math.cos(zig)*300,vy:Math.sin(zig)*300,r:6,d:14*dmgMul,life:2.6}); }
      } else if (type === 1) {
        for (let i = -3; i <= 3; i++) enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+i*.06)*(rage?450:390), vy:Math.sin(a+i*.06)*(rage?450:390), r:6, d:17*dmgMul, life:1.9 });
        if (e.phase % (rage?3:4) === 0) { laserBeams.push({ x1:e.x, y1:e.y, x2:p.x, y2:p.y, width:16, life:.16, color:'#38bdf8' }); takePlayerDamage(8*dmgMul, e.x, e.y); }
      } else {
        if (e.phase % 2 === 0) for (let i = 0; i < (rage?10:7); i++) spawn(i % 2 ? 'split' : 'shoot');
        for (let i = 0; i < (rage?20:15); i++) { const ang = a + i * (Math.PI * 2 / (rage?20:15)) + e.phase*.18; enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(ang)*(rage?235:195), vy:Math.sin(ang)*(rage?235:195), r:7, d:13*dmgMul, life:3.4 }); }
      }
      e.phase++;
    }
  }

  function takePlayerDamage(amount, sx=p.x, sy=p.y) {
    if (chargerTestMode || p.invuln > 0 || state !== 'play') return;

    red = .34; shake = Math.max(shake, .24);

  function pruneForPerformance() {
    if (bullets.length > 430) bullets.splice(0, bullets.length - 430);
    if (enemyBullets.length > 300) enemyBullets.splice(0, enemyBullets.length - 300);
    if (laserBeams.length > 100) laserBeams.splice(0, laserBeams.length - 100);
    if (novaEffects.length > 120) novaEffects.splice(0, novaEffects.length - 120);
    if (pickups.length > 360) { const xp = pickups.filter(pp => pp.t === 'xp').slice(-300); const other = pickups.filter(pp => pp.t !== 'xp').slice(-60); pickups = xp.concat(other); }
    if (!dir.bossRound && enemies.length > (hardMode ? 260 : 220)) {
      const chests = enemies.filter(e => e.t === 'chest').slice(-10);

  function separateEnemies(dt) {
    // 몬스터끼리 같은 점에 뭉쳐서 겹쳐 보이는 문제를 줄이는 분리 힘.
    // 너무 많은 계산을 막기 위해 가까운 순서가 아니라 앞쪽 일부만 검사하고, 보스/상자는 제외한다.
    const list = enemies.filter(e => e && !e.dead && e.t !== 'chest');
    const maxPairs = Math.min(list.length, 145);
    for (let i = 0; i < maxPairs; i++) {
      const a = list[i];
      if (!a) continue;
      for (let j = i + 1; j < maxPairs; j++) {
        const b = list[j];
        if (!b) continue;
        // 보스와 중간보스는 너무 밀리지 않게 일반 몬스터끼리보다 약하게 처리
        const bossPair = a.t === 'arenaBoss' || b.t === 'arenaBoss' || a.t === 'miniBoss' || b.t === 'miniBoss';
        const minD = (a.r || 14) + (b.r || 14) + (bossPair ? 2 : 5);
        let dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d > 0 && d < minD) {
          const push = (minD - d) * (bossPair ? .18 : .46);
          dx /= d; dy /= d;
          const aHeavy = a.t === 'tank' || a.t === 'miniBoss' || a.t === 'arenaBoss';
          const bHeavy = b.t === 'tank' || b.t === 'miniBoss' || b.t === 'arenaBoss';
          const am = aHeavy ? .35 : .5;
          const bm = bHeavy ? .35 : .5;
          if (a.t !== 'arenaBoss') { a.x -= dx * push * bm; a.y -= dy * push * bm; }
          if (b.t !== 'arenaBoss') { b.x += dx * push * am; b.y += dy * push * am; }
          if (dir.bossRound) { clampToBossArena(a, (a.r || 14) + 18); clampToBossArena(b, (b.r || 14) + 18); }
          else {
            a.x = Math.max(a.r || 12, Math.min(world.w - (a.r || 12), a.x));
            a.y = Math.max(a.r || 12, Math.min(world.h - (a.r || 12), a.y));
            b.x = Math.max(b.r || 12, Math.min(world.w - (b.r || 12), b.x));
            b.y = Math.max(b.r || 12, Math.min(world.h - (b.r || 12), b.y));
          }
        } else if (d === 0) {
          b.x += (Math.random() - .5) * 6;
          b.y += (Math.random() - .5) * 6;
        }
      }
    }
  }

  function update(dt) {
    if (state !== 'play') return;
    time += dt; red = Math.max(0, red - dt); waveFlash = Math.max(0, waveFlash - dt);
    if (p.comboT > 0) p.comboT -= dt; else p.combo = 0;
    if (p.regen > 0) p.hp = Math.min(p.maxHp, p.hp + p.regen * dt);
    if (p.dash > 0) p.dash -= dt;
    if (p.dashCd > 0) p.dashCd -= dt;
    if (p.novaCd > 0) p.novaCd -= dt;
    if (p.invuln > 0) p.invuln -= dt;
    for (const w of p.weapons) w.fc -= dt;
    for (let i = laserBeams.length - 1; i >= 0; i--) { laserBeams[i].life -= dt; if (laserBeams[i].life <= 0) laserBeams.splice(i, 1); }
    for (let i = novaEffects.length - 1; i >= 0; i--) { novaEffects[i].life -= dt; if (novaEffects[i].life <= 0) novaEffects.splice(i, 1); }
    for (let i = hitTexts.length - 1; i >= 0; i--) { hitTexts[i].life -= dt; hitTexts[i].y -= 34 * dt; if (hitTexts[i].life <= 0) hitTexts.splice(i, 1); }
    shake = Math.max(0, shake - dt);

    directorTick(dt);
    pruneForPerformance();
    if (state !== 'play') { syncUI(); return; }

    let mx = 0, my = 0;
    if (keys['w'] || keys['arrowup']) my -= 1;
    if (keys['s'] || keys['arrowdown']) my += 1;
    if (keys['a'] || keys['arrowleft']) mx -= 1;
    if (keys['d'] || keys['arrowright']) mx += 1;
    mx += touchMove.x;
    my += touchMove.y;
    const ml = Math.hypot(mx, my), sp = p.moveSpeed * (p.dash > 0 ? 3.4 : 1);
    if (ml > 0) { p.lastAim = Math.atan2(my, mx); p.x += mx / ml * sp * dt; p.y += my / ml * sp * dt; }
    p.x = Math.max(24, Math.min(world.w - 24, p.x)); p.y = Math.max(24, Math.min(world.h - 24, p.y));
    if (dir.bossRound) clampToBossArena(p, p.r + 18);

    if (p.flameT > 0) {
      p.flameT -= dt;
      p.flameTick -= dt;
      const a = p.lastAim || 0;
      const reach = 310 + (p.flameStage || 1) * 26 + (p.flameEvolved ? 90 : 0);
      const sx = p.x + Math.cos(a) * 32, sy = p.y + Math.sin(a) * 32;
      if (novaEffects.length < 120) novaEffects.push({ x:sx, y:sy, r:reach, maxR:reach, color:'#fb923c', life:.13, maxLife:.13, kind:'flamecone', a, spread:.72 });
      for (let k=-3;k<=3;k++) pushPassiveBullet(sx, sy, a + k*.07 + (Math.random()-.5)*.05, 310 + Math.random()*120, (p.flameDmg||12)*.10, .30, 0, 5.5 + Math.random()*2.4, '#fb923c', 'flamepuff');
      if (p.flameTick <= 0) {

    }

    const mainWeapon = p.weapons[0];
    if (!rangedTestMode && !chargerTestMode && !tankTestMode && mainWeapon && mainWeapon.fc <= 0) { mainWeapon.fc = mainWeapon.fr; shootWeapon(mainWeapon); }
    if (!rangedTestMode && !chargerTestMode && !tankTestMode) updatePassiveWeapons(dt);
    syncMainWeaponStats();

    if (rangedTestMode || chargerTestMode || tankTestMode) {
      bullets.length = 0;
      laserBeams.length = 0;

    }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;

      for (const e of enemies.slice()) {

      const b = enemyBullets[i]; b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      if (Math.hypot(b.x - p.x, b.y - p.y) < b.r + p.r) {

    for (const e of enemies.slice()) {

      }

      if (e.t === 'shoot' || e.t === 'sniper' || e.t === 'bomber') {

            const size = e.t === 'sniper' ? 4 : e.t === 'bomber' ? 9 : e.t === 'miniBoss' ? 6 : 5;
            const dmg = (e.t === 'sniper' ? 16 : e.t === 'bomber' ? 12 : e.t === 'miniBoss' ? 13 : 9) * (currentWave <= 2 ? .90 : currentWave <= 4 ? 1.12 : 1.32);
            enemyBullets.push({ x:e.x, y:e.y, vx:Math.cos(a+off)*spd, vy:Math.sin(a+off)*spd, r:size, d:dmg, life:e.t==='sniper'?2.7:3.2 });
          }
        }
      }
      if (e.t === 'arenaBoss' || e.t === 'miniBoss') bossPattern(e, dt);
      if (!isTankStillTestEnemy && e.t !== 'chest' && Math.hypot(e.x - p.x, e.y - p.y) < e.r + p.r - 2) {
        if (e.t === 'bomber') {
          takePlayerDamage((currentWave <= 3 ? 18 : 30), e.x, e.y);
          laserBeams.push({ x1:e.x-55, y1:e.y, x2:e.x+55, y2:e.y, width:12, life:.18, color:e.c });
          laserBeams.push({ x1:e.x, y1:e.y-55, x2:e.x, y2:e.y+55, width:12, life:.18, color:e.c });
          e.dead = true; die(e);
        } else {
          const baseHit = e.t === 'arenaBoss' ? 38 : e.t === 'miniBoss' ? 21 : e.t === 'tank' ? 18 : e.t === 'charger' ? 17 : 11;
          takePlayerDamage(baseHit * (currentWave <= 2 ? .95 : currentWave <= 4 ? 1.15 : 1.38), e.x, e.y);
        }
      }
    }

    separateEnemies(dt);

    for (let i = pickups.length - 1; i >= 0; i--) {
      const pp = pickups[i], dx = p.x - pp.x, dy = p.y - pp.y, d = Math.hypot(dx, dy) || 1;
      const pullByMagnet = pp.t === 'xp' && pp.magnetPull;
      if (!pp.permanent && pp.t !== 'xp') pp.life -= dt;
      if (pullByMagnet || d < p.pickupRadius) {
        const speed = pullByMagnet ? 1900 : 300;
        pp.x += dx / d * speed * dt; pp.y += dy / d * speed * dt;
      }
      if (d < 24) {
        if (pp.t === 'bossReward') showBossChestReward();
        else if (pp.t === 'miniReward') showMiniBossReward();
        else if (pp.t === 'heal') p.hp = Math.min(p.maxHp, p.hp + 16);
        else if (pp.t === 'magnet') { let c=0; for (const xp of pickups) if (xp.t === 'xp') { xp.magnetPull = true; xp.life = 999999; c++; } if (c < 12) { for (let k=0;k<8;k++) dropXpOrb(p.x+(Math.random()-.5)*180, p.y+(Math.random()-.5)*180, 35+currentWave*3, 2); } toastMsg('자석: 맵 전체 XP 폭풍 흡수!'); }
        else gain(pp.amount || 9);
        pickups.splice(i, 1); continue;
      }
      if (!pp.permanent && pp.t !== 'xp' && pp.life <= 0) pickups.splice(i, 1);
    }

    const arenaW2 = world.w * arenaShrinking, arenaH2 = world.h * arenaShrinking;
    const arenaX2 = (world.w - arenaW2) / 2, arenaY2 = (world.h - arenaH2) / 2;
    if (dir.bossRound) {
      cam.x = Math.max(0, Math.min(world.w - innerW, p.x - innerW / 2));
      cam.y = Math.max(0, Math.min(world.h - innerH, p.y - innerH / 2));
    } else {
      cam.x = Math.max(arenaX2, Math.min(Math.max(arenaX2, arenaX2 + arenaW2 - innerW), p.x - innerW / 2));
      cam.y = Math.max(arenaY2, Math.min(Math.max(arenaY2, arenaY2 + arenaH2 - innerH), p.y - innerH / 2));
    }
    syncUI();
  }

  function syncUI() {

    ui.hpFill.style.width = `${(p.hp / p.maxHp) * 100}%`;

    else ui.bossWrap.style.display = 'none';
  }



  // ===== STRONG 2.5D VISUAL PATCH v3: 배경은 유지하고, 플레이 화면만 상하 기준 약 10도 기울어진 것처럼 보이게 조정 =====
  const VIEW_TILT_DEG = 10;
  const VIEW_TILT_SCALE = 0.78; // 실제 10도는 체감이 약해서, 배경은 그대로 두고 플레이 레이어만 더 확실히 눌러 보이게 한다.
  const VIEW_TILT_Y_OFFSET = 0.12;

  function clamp01(v){ return Math.max(0, Math.min(1, v)); }

  function screenDepth(worldY) {
    return clamp01((worldY - cam.y) / Math.max(1, innerH));
  }

  function beginGameplayViewTilt() {
    const pivotX = cam.x + innerW * 0.5;
    const pivotY = cam.y + innerH * 0.5;
    x.save();
    x.translate(pivotX, pivotY + innerH * VIEW_TILT_Y_OFFSET);
    // 화면 위아래 방향만 눌러서, 배경이 아니라 맵 위의 플레이 대상들이 비스듬히 누운 것처럼 보이게 한다.
    x.scale(1, VIEW_TILT_SCALE);
    x.translate(-pivotX, -pivotY);
  }

  function shadeColor(hex, amt) {
    let h = String(hex || '#ffffff').replace('#','');
    if (h.length === 3) h = h.split('').map(c=>c+c).join('');
    const n = parseInt(h,16);
    let r = (n>>16)&255, g=(n>>8)&255, b=n&255;
    r = Math.max(0, Math.min(255, r + amt));
    g = Math.max(0, Math.min(255, g + amt));
    b = Math.max(0, Math.min(255, b + amt));
    return `rgb(${r},${g},${b})`;
  }

  function drawEllipse(cx, cy, rx, ry, color, alpha=1) {
    x.save();
    x.globalAlpha *= alpha;
    x.fillStyle = color;
    x.beginPath();
    x.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
    x.fill();
    x.restore();
  }

  function drawCastShadow(cx, groundY, r, height=28, alpha=0.50) {
    // 왼쪽 위에서 빛이 온다고 가정해서 오른쪽 아래로 긴 그림자 투사
    const depth = screenDepth(groundY);
    const sx = r * (2.35 + depth * .95) + height * .58;
    const sy = r * (.42 + depth * .22);
    const offX = height * .96 + 24;
    const offY = height * .46 + 12;
    x.save();
    x.globalAlpha = alpha;
    const sh = x.createRadialGradient(cx + offX * .35, groundY + offY * .35, 2, cx + offX, groundY + offY, sx);
    sh.addColorStop(0, 'rgba(0,0,0,.76)');
    sh.addColorStop(.45, 'rgba(0,0,0,.36)');
    sh.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = sh;
    x.beginPath();
    x.ellipse(cx + offX, groundY + offY, sx, sy, .20, 0, Math.PI * 2);
    x.fill();
    x.restore();
  }

  function drawDropShadow(cx, cy, r, alpha=0.34) {
    drawCastShadow(cx, cy + r * .65, r, r * 1.1, alpha);
  }

  function drawDepthGround() {
    // v3: 배경은 사용자가 가장 괜찮다고 한 초기 버전의 깔끔한 네온 우주 격자로 복귀.
    // 대신 캐릭터/몬스터/상자 그림자는 그대로 남겨 2.5D 느낌은 유지한다.
    for (let gx = 0; gx < world.w; gx += 48) {

      x.lineWidth = gx % 240 === 0 ? 1.25 : 1;
      x.beginPath();
      x.moveTo(gx, 0);
      x.lineTo(gx, world.h);
      x.stroke();
    }
    for (let gy = 0; gy < world.h; gy += 48) {
      x.strokeStyle = gy % 240 === 0 ? 'rgba(168,85,247,0.16)' : 'rgba(80,120,255,0.10)';
      x.lineWidth = gy % 240 === 0 ? 1.25 : 1;
      x.beginPath();
      x.moveTo(0, gy);
      x.lineTo(world.w, gy);
      x.stroke();

    // 너무 튀는 기둥/원근 바닥은 제거하고, 가장자리만 은은하게 남김.
    x.strokeStyle='rgba(34,211,238,.50)';
    x.lineWidth=4;
    x.strokeRect(0,0,world.w,world.h);
  }

    x.beginPath(); x.moveTo(r, -r*.38); x.lineTo(r+depth, -r*.38-depth*.58); x.lineTo(r+depth, r*.87-depth*.58); x.lineTo(r, r*.87); x.closePath(); x.fill();
    // 윗면
    x.fillStyle = '#fb923c';
    x.beginPath(); x.moveTo(-r, -r*.38); x.lineTo(-r+depth, -r*.38-depth*.58); x.lineTo(r+depth, -r*.38-depth*.58); x.lineTo(r, -r*.38); x.closePath(); x.fill();
    // 금속 띠
    x.fillStyle = '#fed7aa';
    x.fillRect(-r+4, r*.04, r*2-8, r*.22);

  function getTankAlienSpriteName(angle) {
    const base = getRangedAlienSpriteName(angle);
    const map = {
      right: 'right',
      downRight: 'downLeft',
      down: 'up',
      downLeft: 'downRight',
      left: 'left',
      upLeft: 'upLeft',
      up: 'down',
      upRight: 'upRight'
    };
    return map[base] || base;
  }

  function getChargerSpriteName(angle) {
    const base = getRangedAlienSpriteName(angle);
    const map = {
      up: 'up',
      down: 'down',
      upLeft: 'upLeft',
      downLeft: 'downLeft',
      upRight: 'upRight',
      downRight: 'downRight',
      left: 'left',
      right: 'right'
    };
    return map[base] || base;
  }

    const isRangedAlien = (e.t === 'shoot' || e.t === 'sniper' || e.t === 'bomber');

    if (e.t === 'tank') {
      const faceAngle = (e.faceA != null) ? e.faceA : Math.atan2(p.y - e.y, p.x - e.x);
      const spriteName = getTankAlienSpriteName(faceAngle);
      const sprite = tankAlienSprites[spriteName];
      if (sprite && sprite.complete && sprite.naturalWidth > 0) {
        const bob = tankTestMode ? 0 : Math.sin(time * 3.8 + e.x * 0.007 + e.y * 0.005) * (e.r * 0.02);
        const drawW = e.r * 5.70 * (tankAlienSpriteScale[spriteName] || 1); // v41: 화질이 덜 뭉개져 보이도록 살짝 확대
        const drawH = drawW * (sprite.naturalHeight / sprite.naturalWidth);
        const cx = e.x;
        const cy = e.y - e.r * 0.05 + bob;

        x.save();
        x.imageSmoothingEnabled = true;
        if ('imageSmoothingQuality' in x) x.imageSmoothingQuality = 'high';
        x.globalAlpha = 0.995;
        x.drawImage(sprite, cx - drawW * 0.5, cy - drawH * 0.5, drawW, drawH);
        x.restore();
        return;
      }
    }

    if (e.t === 'charger') {
      const faceAngle = (e.faceA != null) ? e.faceA : Math.atan2(p.y - e.y, p.x - e.x);
      const spriteName = getChargerSpriteName(faceAngle);
      const sprite = chargerDevilSprites[spriteName];
      if (sprite && sprite.complete && sprite.naturalWidth > 0) {

        x.imageSmoothingEnabled = true;
        x.globalAlpha = 0.99;
        x.drawImage(sprite, cx - drawW * 0.5, cy - drawH * 0.5, drawW, drawH);
        x.restore();
        return;
      }
    }

        const cx = e.x;
        const cy = e.y - e.r * 0.03 + e.r * (rangedAlienSpriteYOffset[spriteName] || 0) + bob;

        x.save();
        x.imageSmoothingEnabled = true;
        x.globalAlpha = 0.99;
        x.drawImage(sprite, cx - drawW * 0.5, cy - drawH * 0.5, drawW, drawH);
        x.restore();
        return;
      }
    }

    const h = e.r * (boss ? 2.30 : 1.80);
    const groundY = e.y + e.r * .58;
    const bodyY = e.y - h * .34;

    // 몬스터 몸 전체를 매 프레임 회전시키지 않고,
    // 앞면 확인용 검정 점만 플레이어 쪽 좌표에 찍는다.
    const faceA = Math.atan2(p.y - e.y, p.x - e.x);

    drawCastShadow(e.x, groundY, e.r, h, boss ? .58 : .40);

    x.save();

    // 아래 받침/다리
    x.fillStyle = shadeColor(e.c, -70);
    x.beginPath(); x.ellipse(e.x - e.r*.34, groundY - e.r*.18, e.r*.26, e.r*.48, -0.12, 0, Math.PI*2); x.fill();
    x.beginPath(); x.ellipse(e.x + e.r*.34, groundY - e.r*.18, e.r*.26, e.r*.48, 0.12, 0, Math.PI*2); x.fill();

    // 세워진 몸체
    const grad = x.createRadialGradient(e.x - e.r*.45, bodyY - h*.22, e.r*.12, e.x + e.r*.10, bodyY + h*.18, e.r*1.45);
    grad.addColorStop(0, '#ffffff');
    grad.addColorStop(.10, shadeColor(e.c, 55));
    grad.addColorStop(.45, e.c);
    grad.addColorStop(1, shadeColor(e.c, -95));

    // 몬스터 수가 많을 때 렉을 줄이기 위해 일반몹 그림자 블러 제거, 보스만 블러 유지
    if (boss) {
      x.shadowColor = e.c;
      x.shadowBlur = 22;
    }

    x.fillStyle = grad;
    x.beginPath();
    x.ellipse(e.x, bodyY, e.r * (boss ? .98 : .86), h * .50, 0, 0, Math.PI * 2);
    x.fill();
    x.shadowBlur = 0;

    // 몸체 테두리와 하이라이트
    x.strokeStyle = boss ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.55)';
    x.lineWidth = Math.max(1.6, e.r * .06);
    x.beginPath(); x.ellipse(e.x, bodyY, e.r * (boss ? .98 : .86), h * .50, 0, 0, Math.PI * 2); x.stroke();

    x.fillStyle = 'rgba(255,255,255,.58)';
    x.beginPath(); x.ellipse(e.x - e.r*.34, bodyY - h*.23, e.r*.20, e.r*.10, -0.42, 0, Math.PI*2); x.fill();

    // 앞면 확인용 검정색 점: 이 점만 플레이어 방향으로 이동
    const dotDist = e.r * (boss ? .78 : .66);
    const dotX = e.x + Math.cos(faceA) * dotDist;
    const dotY = bodyY + Math.sin(faceA) * dotDist * .72;
    x.fillStyle = '#050505';
    x.beginPath();
    x.arc(dotX, dotY, Math.max(3.0, e.r * .15), 0, Math.PI * 2);
    x.fill();

    // 보스는 뿔/어깨 유지
    if (boss) {
      x.fillStyle = shadeColor(e.c, 35);
      x.beginPath(); x.moveTo(e.x-e.r*.75, bodyY-h*.18); x.lineTo(e.x-e.r*1.32, bodyY-h*.43); x.lineTo(e.x-e.r*.52, bodyY-h*.36); x.closePath(); x.fill();
      x.beginPath(); x.moveTo(e.x+e.r*.75, bodyY-h*.18); x.lineTo(e.x+e.r*1.32, bodyY-h*.43); x.lineTo(e.x+e.r*.52, bodyY-h*.36); x.closePath(); x.fill();
      x.strokeStyle = 'rgba(255,255,255,.52)'; x.stroke();
    }

  const playerSpriteImages = playerSpriteDataUris.map(src => { const img = new Image(); img.src = src; return img; });

    while (a <= -Math.PI) a += Math.PI * 2;
    while (a > Math.PI) a -= Math.PI * 2;
    return a;
  }

  function getPlayerSpriteIndex(a) {
    const sector = ((Math.round(normalizeAngle(a) / (Math.PI / 4)) % 8) + 8) % 8;
    return sector;
  }


  function drawPlayerBody() {
    const a = p.lastAim || 0;
    const idx = getPlayerSpriteIndex(a);
    const img = playerSpriteImages[idx];
    const drawSize = PLAYER_SPRITE_SIZE;
    const cx = p.x;
    const cy = p.y - 4;

    drawCastShadow(cx, cy + drawSize * .23, p.r * 1.25, p.r * 1.45, .36);
    x.save();
    if (p.invuln > 0) x.globalAlpha = .45 + Math.sin(time * 38) * .25;
    x.imageSmoothingEnabled = true;

    if (img && img.complete) {
      x.drawImage(img, cx - drawSize * .5, cy - drawSize * .5, drawSize, drawSize);
    } else {
      x.fillStyle = '#7cf28f';
      x.beginPath(); x.arc(cx, cy, p.r * 1.25, 0, Math.PI * 2); x.fill();
    }
    x.restore();
  }

  function draw() {
    const ox = shake > 0 ? (Math.random()-.5) * 18 * (shake/.24) : 0;
    const oy = shake > 0 ? (Math.random()-.5) * 18 * (shake/.24) : 0;
    x.save(); x.translate(ox, oy);
    const g = x.createRadialGradient(innerW/2, innerH/2, 80, innerW/2, innerH/2, Math.max(innerW, innerH)); g.addColorStop(0, '#102a44'); g.addColorStop(.55, '#07162e'); g.addColorStop(1, '#030611'); x.fillStyle = g; x.fillRect(-30, -30, innerW+60, innerH+60);
    x.save(); x.translate(-cam.x, -cam.y);
    for (const s of stars) { s.y += s.z * .22; if (s.y > world.h + 2) { s.y = -2; s.x = Math.random() * world.w; } x.fillStyle = `rgba(180,210,255,${0.25 + s.z * 0.25})`; x.fillRect(s.x, s.y, s.z * 2, s.z * 2); }
    drawDepthGround();

    // 메뉴/스토리/무기선택/게임오버 화면에서는 전투 오브젝트를 그리지 않아서,
    // 로비로 돌아갔을 때 죽기 직전 화면이 뒤에 남지 않게 한다.
    if (state === 'menu' || state === 'story' || state === 'pick' || state === 'gameover') {
      x.restore();
      x.restore();
      return;
    }

    // 배경 격자/우주감은 그대로 두고, 실제 플레이 요소만 화면 기준 위아래로 10도 정도 기울어진 것처럼 렌더링한다.
    beginGameplayViewTilt();
    if (dir.bossRound) { const bb=bossArenaBounds(0); x.save(); x.strokeStyle='rgba(248,113,113,.95)'; x.lineWidth=8; x.setLineDash([18,12]); x.strokeRect(bb.x1,bb.y1,bb.x2-bb.x1,bb.y2-bb.y1); x.setLineDash([]); x.fillStyle='rgba(248,113,113,.06)'; x.fillRect(bb.x1,bb.y1,bb.x2-bb.x1,bb.y2-bb.y1); x.restore(); }

    for (const beam of laserBeams) {

      x.globalAlpha = alpha;
      if (beam.kind === 'thunder') {
        x.strokeStyle = beam.color; x.lineWidth = beam.width;
        const dx = beam.x2 - beam.x1, dy = beam.y2 - beam.y1, segs = 6;
        x.beginPath(); x.moveTo(beam.x1, beam.y1);
        for (let i = 1; i < segs; i++) {
          const t = i / segs;
          const px = beam.x1 + dx * t + (Math.random() - .5) * 24;
          const py = beam.y1 + dy * t + (Math.random() - .5) * 18;
          x.lineTo(px, py);

        x.lineTo(beam.x2, beam.y2); x.stroke();
        x.strokeStyle = '#ffffff'; x.lineWidth = Math.max(2, beam.width * .28); x.stroke();
      } else if (beam.kind === 'rail') {
        x.strokeStyle = beam.color; x.lineWidth = beam.width; x.beginPath(); x.moveTo(beam.x1, beam.y1); x.lineTo(beam.x2, beam.y2); x.stroke();

        const a = Math.atan2(beam.y2 - beam.y1, beam.x2 - beam.x1); const mx = (beam.x1 + beam.x2) / 2, my = (beam.y1 + beam.y2) / 2;

      } else {

        x.lineWidth = Math.max(2, beam.width * 0.35); x.strokeStyle = '#ffffff'; x.beginPath(); x.moveTo(beam.x1, beam.y1); x.lineTo(beam.x2, beam.y2); x.stroke();

        x.closePath(); x.fill();

      } else if (ef.kind === 'flame') {
        x.strokeStyle = ef.color; x.lineWidth = 9; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
        for (let i=0;i<10;i++){ const a=i*Math.PI*2/10 + time*4; x.beginPath(); x.moveTo(ef.x+Math.cos(a)*(ef.r*.4), ef.y+Math.sin(a)*(ef.r*.4)); x.lineTo(ef.x+Math.cos(a)*(ef.r+grow),ef.y+Math.sin(a)*(ef.r+grow)); x.stroke(); }
      } else if (ef.kind === 'pulsegrid') {
        x.strokeStyle = ef.color; x.lineWidth = 4; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
        x.strokeRect(ef.x-(ef.r*.55+grow*.35), ef.y-(ef.r*.55+grow*.35), (ef.r*1.1+grow*.7), (ef.r*1.1+grow*.7));
      } else if (ef.kind === 'boomer') {
        x.strokeStyle = ef.color; x.lineWidth = 4; for (let i=0;i<3;i++){ x.beginPath(); x.arc(ef.x, ef.y, ef.r*.45 + i*ef.r*.18 + grow*.3, Math.PI*.15, Math.PI*1.45); x.stroke(); }
      } else if (ef.kind === 'mine') {
        x.fillStyle = ef.color; x.beginPath(); x.arc(ef.x, ef.y, ef.r*.30 + grow*.3, 0, Math.PI*2); x.fill();
        x.strokeStyle = '#fff'; x.lineWidth = 3; for (let i=0;i<8;i++){ const a=i*Math.PI*2/8; x.beginPath(); x.moveTo(ef.x,ef.y); x.lineTo(ef.x+Math.cos(a)*(ef.r+grow), ef.y+Math.sin(a)*(ef.r+grow)); x.stroke(); }
      } else if (ef.kind === 'drone') {
        x.strokeStyle = ef.color; x.lineWidth = 2.5; x.strokeRect(ef.x-ef.r*.6, ef.y-ef.r*.6, ef.r*1.2, ef.r*1.2);
      } else if (ef.kind === 'muzzle') {
        x.strokeStyle = ef.color; x.lineWidth = 5; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, -0.6, 0.6); x.stroke();
      } else {
        x.strokeStyle = ef.color; x.lineWidth = ef.kind === 'poison' || ef.kind === 'flame' ? 10 : 6; x.beginPath(); x.arc(ef.x, ef.y, ef.r + grow, 0, Math.PI * 2); x.stroke();
      }
      x.globalAlpha = 1;
    }
    for (const b of bullets) {
      x.fillStyle = b.c; x.strokeStyle = '#ffffff'; x.lineWidth = 1.6;
      if (b.src === 'drone') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*1.3, -b.r*.55, b.r*2.6, b.r*1.1); x.strokeRect(-b.r*1.3, -b.r*.55, b.r*2.6, b.r*1.1); x.restore();
      } else if (b.src === 'boomer') {
        x.beginPath(); x.arc(b.x, b.y, b.r, Math.PI*0.18, Math.PI*1.55); x.stroke();
      } else if (b.src === 'shardfall' || b.src === 'support-shard') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.beginPath(); x.moveTo(0, -b.r*1.6); x.lineTo(b.r, 0); x.lineTo(0, b.r*1.6); x.lineTo(-b.r, 0); x.closePath(); x.fill(); x.restore();
      } else if (b.src === 'flamepuff') {
        const grad = x.createRadialGradient(b.x, b.y, 1, b.x, b.y, b.r*2.1);
        grad.addColorStop(0, '#fff7ad'); grad.addColorStop(.42, '#fb923c'); grad.addColorStop(1, b.c);
        x.fillStyle = grad; x.globalAlpha = .82;
        x.beginPath(); x.arc(b.x, b.y, b.r*1.8, 0, Math.PI*2); x.fill(); x.globalAlpha = 1;
      } else if (b.src === 'ember') {
        x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI*2); x.fill(); x.beginPath(); x.arc(b.x + 1.5, b.y - 1.5, b.r*.45, 0, Math.PI*2); x.fillStyle = '#fde68a'; x.fill();
      } else if (b.src === 'spore') {
        x.globalAlpha = .75; for (let i=0;i<3;i++){ x.beginPath(); x.arc(b.x + Math.cos(i*2.1)*2.5, b.y + Math.sin(i*2.1)*2.5, b.r*.62, 0, Math.PI*2); x.fill(); } x.globalAlpha = 1;
      } else if (b.src === 'shrapnel') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*.2, -b.r*1.3, b.r*.4, b.r*2.6); x.restore();
      } else if (b.src === 'subshotgun') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.beginPath(); x.moveTo(-b.r*1.1, -b.r*.8); x.lineTo(b.r*1.3, 0); x.lineTo(-b.r*1.1, b.r*.8); x.closePath(); x.fill(); x.restore();
      } else if (b.src === 'support-pulse') {
        x.beginPath(); x.arc(b.x, b.y, b.r*1.15, 0, Math.PI*2); x.stroke(); x.beginPath(); x.arc(b.x, b.y, b.r*.55, 0, Math.PI*2); x.fill();
      } else if (b.src === 'support-rifle') {
        x.save(); x.translate(b.x, b.y); x.rotate(Math.atan2(b.vy, b.vx)); x.fillRect(-b.r*1.4, -b.r*.35, b.r*2.8, b.r*.7); x.restore();
      } else {
        x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fill();
      }
    }
    for (const b of enemyBullets) { x.beginPath(); x.arc(b.x, b.y, b.r, 0, Math.PI * 2); x.fillStyle = '#fb7185'; x.fill(); }
    for (const e of enemies) {
      drawEnemyBody(e);
      x.fillStyle = '#fff'; x.fillRect(e.x - e.r, e.y - e.r*1.55 - 10, e.r * 2, 4); x.fillStyle = '#ef4444'; x.fillRect(e.x - e.r, e.y - e.r*1.55 - 10, e.r * 2 * (e.hp / e.mhp), 4);
    }
    for (const pp of pickups) {
      drawDropShadow(pp.x, pp.y, pp.t === 'bossReward' ? 18 : pp.t === 'miniReward' ? 15 : pp.t === 'magnet' ? 18 : pp.t === 'heal' ? 8 : 6, .24);
      if (pp.t === 'magnet') {
        x.save(); x.translate(pp.x, pp.y);
        const pulse = Math.sin(time*5)*2;
        x.globalAlpha = .25; x.fillStyle = '#38bdf8'; x.beginPath(); x.arc(0, 0, 27 + pulse, 0, Math.PI*2); x.fill(); x.globalAlpha = 1;
        x.lineCap = 'round'; x.lineJoin = 'round';
        x.lineWidth = 9; x.strokeStyle = '#38bdf8';
        x.beginPath(); x.arc(0, -2, 17, Math.PI * .12, Math.PI * .88, false); x.stroke();
        x.lineWidth = 5; x.strokeStyle = '#e0f2fe'; x.beginPath(); x.arc(0, -2, 17, Math.PI * .22, Math.PI * .78, false); x.stroke();
        x.fillStyle = '#ef4444'; x.fillRect(-22, 3, 11, 16); x.fillStyle = '#f8fafc'; x.fillRect(11, 3, 11, 16);
        x.strokeStyle = '#ffffff'; x.lineWidth = 2; x.strokeRect(-22, 3, 11, 16); x.strokeRect(11, 3, 11, 16);
        x.fillStyle = '#e0f2fe'; x.font = 'bold 10px system-ui'; x.textAlign = 'center'; x.fillText('MAG', 0, -23); x.fillText('XP', 0, 33);
        x.restore();
      } else if (pp.t === 'miniReward') {
        x.save(); x.translate(pp.x, pp.y); x.fillStyle = '#f59e0b'; x.strokeStyle = '#fff7ed'; x.lineWidth = 3; x.fillRect(-15,-15,30,30); x.strokeRect(-15,-15,30,30); x.fillStyle='#fff7ed'; x.font='bold 11px system-ui'; x.textAlign='center'; x.fillText('MID',0,4); x.restore();
      } else if (pp.t === 'bossReward') {
        x.save(); x.translate(pp.x, pp.y); x.fillStyle = '#dc2626'; x.strokeStyle = '#fff7ed'; x.lineWidth = 4; x.fillRect(-18,-18,36,36); x.strokeRect(-18,-18,36,36); x.fillStyle='#fff7ed'; x.font='bold 11px system-ui'; x.textAlign='center'; x.fillText('BOSS',0,4); x.restore();
      } else if (pp.t === 'heal') {
        x.beginPath(); x.arc(pp.x, pp.y, 8, 0, Math.PI * 2); x.fillStyle = '#22c55e'; x.fill(); x.fillStyle = '#ffffff'; x.fillRect(pp.x-2, pp.y-6, 4, 12); x.fillRect(pp.x-6, pp.y-2, 12, 4);
      } else {
        const tier = pp.tier || 1, rr = tier === 3 ? 10 : tier === 2 ? 8 : 6;
        x.beginPath(); x.arc(pp.x, pp.y, rr, 0, Math.PI * 2); x.fillStyle = tier === 3 ? '#f472b6' : tier === 2 ? '#60a5fa' : '#facc15'; x.fill();
        x.strokeStyle = '#ffffff'; x.lineWidth = 1.5; x.stroke();
      }
    }
    const orbitSub = p.weapons.slice(1).find(w => w && w.key === 'orbit');
    if (orbitSub) {
      const blades = Math.min(8, 3 + orbitSub.stage + (orbitSub.evolved ? 2 : 0));
      const rr = 110 + orbitSub.stage * 12 + (orbitSub.evolved ? 40 : 0);
      x.strokeStyle = weaponPool.orbit.color; x.lineWidth = 3; x.globalAlpha = .82;
      for (let i=0;i<blades;i++) {
        const a = time * 3.4 + i * Math.PI * 2 / blades;
        x.beginPath();
        x.moveTo(p.x + Math.cos(a) * (rr - 18), p.y + Math.sin(a) * (rr - 18));
        x.lineTo(p.x + Math.cos(a) * (rr + 18), p.y + Math.sin(a) * (rr + 18));
        x.stroke();
      }
      x.globalAlpha = 1;
    }
    const droneSub = p.weapons.slice(1).find(w => w && w.key === 'drone');
    if (droneSub) {
      const drones = Math.min(6, 2 + droneSub.stage + (droneSub.evolved ? 2 : 0));
      for (let i=0;i<drones;i++) {
        const a = time * 2.4 + i * Math.PI * 2 / drones;
        x.beginPath(); x.arc(p.x + Math.cos(a)*60, p.y + Math.sin(a)*60, 6, 0, Math.PI*2); x.fillStyle = weaponPool.drone.color; x.fill();
      }
    }
    drawPlayerBody();
    for (const ht of hitTexts) { x.globalAlpha = Math.max(0, ht.life/.55); x.fillStyle = '#fecaca'; x.font = 'bold 20px system-ui'; x.textAlign='center'; x.fillText(ht.text, ht.x, ht.y); x.globalAlpha = 1; }
    x.restore(); // gameplay tilt layer
    x.restore();

    if (red > 0) { x.fillStyle = `rgba(255,40,40,${Math.min(.38, red * 0.9)})`; x.fillRect(-30, -30, innerW+60, innerH+60); x.strokeStyle = `rgba(255,80,80,${Math.min(.9, red*2)})`; x.lineWidth = 18; x.strokeRect(8, 8, innerW-16, innerH-16); }
    if (waveFlash > 0) { const a = Math.min(1, waveFlash / 1.6); const waveY = innerW <= 760 ? 162 : 146; x.globalAlpha = a; x.textAlign='center'; x.font=(innerW <= 760 ? '900 34px system-ui' : '900 42px system-ui'); x.fillStyle='#e0f2fe'; x.shadowColor='#67e8f9'; x.shadowBlur=20; x.fillText(`${hardMode?'HARD ':''}WAVE ${currentWave}`, innerW/2, waveY); x.shadowBlur=0; x.globalAlpha=1; }
    x.restore();

    const w = minimapCanvas.width, h = minimapCanvas.height;
    mc.clearRect(0, 0, w, h); mc.fillStyle = '#07101f'; mc.fillRect(0, 0, w, h);
    const sx = w / world.w, sy = h / world.h; mc.strokeStyle = 'rgba(255,255,255,0.12)'; mc.strokeRect(1, 1, w - 2, h - 2);
    for (const e of enemies.slice(0, 90)) { mc.fillStyle = e.t === 'arenaBoss' ? '#ff5d73' : e.t === 'miniBoss' ? '#f59e0b' : e.t === 'chest' ? '#f97316' : '#a78bfa'; const s = e.t === 'arenaBoss' ? 5 : e.t === 'miniBoss' ? 4 : e.t === 'chest' ? 4 : 3; mc.fillRect(e.x * sx - s / 2, e.y * sy - s / 2, s, s); }
    mc.fillStyle = '#7dd3fc'; mc.beginPath(); mc.arc(p.x * sx, p.y * sy, 3.5, 0, Math.PI * 2); mc.fill();
    mc.strokeStyle = 'rgba(125,211,252,0.6)'; mc.strokeRect(cam.x * sx, cam.y * sy, innerW * sx, innerH * sy);
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    try { update(dt); draw(); }
    catch (err) {
      console.error('game loop recovered', err);
      bullets = bullets.slice(-120); enemyBullets = enemyBullets.slice(-80); laserBeams = laserBeams.slice(-30); pickups = pickups.slice(-60);
      enemies = enemies.filter(e => e && !e.dead).slice(-80);
      if (!safetyNotice) { safetyNotice = true; toastMsg('오류 자동 복구됨'); setTimeout(() => safetyNotice = false, 2000); }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./service-worker.js').catch(() => {});
    });
  }

})();
</script>
</body>
</html>
